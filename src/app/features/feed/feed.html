<section>
  <div class="container grid lg:grid-cols-[220px_minmax(0,1fr)_320px] gap-4 items-start mt-5">
    <!-- left sidbar -->

    <aside
      class="w-full text-sm sticky top-0 bg-white rounded-[20px] shadow-sm border border-slate-50 p-2.5 flex flex-col gap-1"
      aria-label="Sidebar Navigation"
    >
      <button
        class="flex items-center gap-4 p-2 cursor-pointer rounded-xl bg-blue-50 text-blue-600 font-semibold transition-colors duration-200"
      >
        <i class="fa-regular fa-newspaper w-5 text-center"></i>
        <span class="">Feed</span>
      </button>

      <button
        class="flex items-center gap-4 p-2 cursor-pointer rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors duration-200 group"
      >
        <i
          class="fa-solid fa-wand-magic-sparkles w-5 text-center text-slate-500 group-hover:text-slate-700 transition-colors"
        ></i>
        <span class="">My Posts</span>
      </button>

      <button
        class="flex items-center gap-4 p-2 cursor-pointer rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors duration-200 group"
      >
        <i
          class="fa-solid fa-globe w-5 text-center text-slate-500 group-hover:text-slate-700 transition-colors"
        ></i>
        <span class="">Community</span>
      </button>

      <button
        class="flex items-center gap-4 p-2 cursor-pointer rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors duration-200 group"
      >
        <i
          class="fa-regular fa-bookmark w-5 text-center text-slate-500 group-hover:text-slate-700 transition-colors"
        ></i>
        <span class="">Saved</span>
      </button>
    </aside>
    <!-- left sidbar -->

    <!-- content -->
    <section>
      <div class="bg-white rounded-[16px] my-3 shadow-sm border border-slate-200 p-4 font-sans">
        <!-- user details  -->
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-center gap-3">
            <img
              src="https://i.pravatar.cc/150?img=11"
              alt="Ahmed Menisy"
              class="size-10 rounded-full object-cover shrink-0 bg-slate-100 border border-slate-50"
            />

            <div>
              <span
                class="text-[15px] font-bold text-slate-900 leading-tight hover:underline cursor-pointer"
                >Ahmed Menisy</span
              >
              <div class="flex items-center text-[13px] text-slate-500 mt-0.5 gap-1">
                <span class="hover:underline cursor-pointer">@menisy</span>
                <span>&middot;</span>
                <span class="hover:underline cursor-pointer">12h</span>
                <span>&middot;</span>

                <div
                  class="p-0 w-fit items-center bg-neutral-secondary-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                >
                  <select
                    class="border-none bg-transparent cursor-pointer ring-0 py-0 px-2 text-xs"
                  >
                    <option value="public">public</option>
                    <option value="following">followers</option>
                    <option value="only_me">only me</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="relative group">
            <button
              id="dropdownMenuIconButton"
              data-dropdown-toggle="dropdownDots"
              class="text-heading bg-neutral-primary box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-base text-sm p-2 focus:outline-none"
              type="button"
            >
              <svg
                class="w-6 h-6"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="3"
                  d="M12 6h.01M12 12h.01M12 18h.01"
                />
              </svg>
            </button>

            <!-- Dropdown menu -->
            <div
              id="dropdownDots"
              class="z-30 hidden group-hover:block absolute bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
            >
              <ul
                class="p-2 text-sm text-body font-medium"
                aria-labelledby="dropdownMenuIconButton"
              >
                <li>
                  <button
                    class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                  >
                    Save Post
                  </button>
                  <button
                    class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                  >
                    Edit post
                  </button>
                  <button
                    class="inline-flex text-red-700 items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                  >
                    Delete post
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <!-- post content  -->
        <div class="text-[15px] text-slate-900 mb-4">
          <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quae, quod?</p>
          <img
            src="/assets/hack2.jpg"
            class="w-full max-h-90 object-cover rounded shadow mt-2"
            alt=""
          />
        </div>

        <!-- like share comments  counts & view details -->
        <div class="flex items-center justify-between text-[13px] text-slate-500 mb-3 px-1">
          <div class="flex items-center gap-1.5 cursor-pointer hover:underline">
            <div
              class="w-5 h-5 rounded-full bg-blue-500 text-white flex items-center justify-center text-2xs"
            >
              <i class="fa-solid fa-thumbs-up"></i>
            </div>
            <span>0 likes</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="cursor-pointer hover:underline">0 shares</span>
            <span class="cursor-pointer hover:underline">1 comments</span>
            <button class="font-semibold cursor-pointer text-blue-600 hover:underline">
              View details
            </button>
          </div>
        </div>

        <hr class="border-t border-slate-200 mb-1" />

        <!-- buttons like - comment - share -->
        <div class="flex items-center justify-between px-1 py-1">
          <button
            class="flex-1 cursor-pointer flex items-center justify-center gap-2 text-slate-600 font-semibold text-[14px] hover:bg-slate-50 py-2 rounded-lg transition-colors"
          >
            <i class="fa-regular fa-thumbs-up text-lg"></i>
            Like
          </button>
          <button
            class="flex-1 flex cursor-pointer items-center justify-center gap-2 text-slate-600 font-semibold text-[14px] hover:bg-slate-50 py-2 rounded-lg transition-colors"
          >
            <i class="fa-regular fa-message text-lg"></i>
            Comment
          </button>
          <button
            class="flex-1 flex cursor-pointer items-center justify-center gap-2 text-slate-600 font-semibold text-[14px] hover:bg-slate-50 py-2 rounded-lg transition-colors"
          >
            <i class="fa-solid fa-share text-lg"></i>
            Share
          </button>
        </div>

        <hr class="border-t border-slate-200 mt-1 mb-4" />
      </div>
    </section>
    <!-- content -->

    <!-- right sidv\bar -->
    <aside
      class="bg-white sticky top-0 rounded-3xl shadow-sm border border-slate-100 p-4 font-sans"
    >
      <div class="flex items-center justify-between mb-4 px-1">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-user-group text-blue-600 text-[1.1rem]"></i>
          <h2 class="font-bold text-slate-900 text-[17px]">Suggested Friends</h2>
        </div>
        <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-1 rounded-full"
          >5</span
        >
      </div>

      <div class="relative mb-4">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
          <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
        </div>
        <input
          type="text"
          class="bg-white border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 placeholder-slate-400 outline-none transition-all"
          placeholder="Search friends..."
          aria-label="Search friends"
        />
      </div>

      <div class="grid gap-3 overflow-y-auto max-h-88 pb-1">
        <div
          class="p-3 border border-slate-200 rounded-2xl bg-white hover:border-slate-300 transition-colors"
        >
          <div class="flex items-start gap-3">
            <img
              src="https://i.pravatar.cc/150?img=11"
              alt="Ahmed Bahnasy"
              class="w-11 h-11 rounded-full object-cover shrink-0 bg-slate-100 border border-slate-50"
            />

            <div class="flex-1 min-w-0 flex flex-col gap-2">
              <div class="flex items-center justify-between gap-2 mt-0.5">
                <div class="flex flex-col min-w-0">
                  <span class="text-[14px] font-bold text-slate-900 truncate leading-tight"
                    >Ahmed Bahnasy</span
                  >
                  <span class="text-[13px] text-slate-500 truncate leading-tight mt-0.5"
                    >@bahnasy20222...</span
                  >
                </div>
                <button
                  class="shrink-0 flex items-center gap-1.5 px-3.5 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 text-[13px] font-bold rounded-xl transition-colors"
                >
                  <i class="fa-solid fa-user-plus text-[11px]"></i>
                  Follow
                </button>
              </div>

              <div class="flex items-center gap-2">
                <span
                  class="text-[11px] font-semibold text-slate-500 bg-slate-100/80 px-2 py-1 rounded-lg"
                  >41 followers</span
                >
                <span
                  class="text-[11px] font-semibold text-blue-500 bg-blue-50 px-2 py-1 rounded-lg"
                  >2 mutual</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <button
        class="w-full cursor-pointer mt-3 py-2.5 bg-white border border-slate-200 rounded-xl text-[14px] font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-all outline-none focus:ring-4 focus:ring-slate-100"
      >
        View more
      </button>
    </aside>
    <!-- right sidv\bar -->
  </div>
</section>
