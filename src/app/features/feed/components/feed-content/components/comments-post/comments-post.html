<!-- ------------------------------  -----------------  comments  -----------   ---------------------------- -->

<section class="border border-slate-200 rounded-[16px] p-4 bg-white" aria-label="Comments">
  <div class="flex items-center gap-2 mb-2">
    <h3 class="font-bold text-[15px] text-slate-900">Comments</h3>
    <span class="bg-blue-100 text-blue-600 text-[12px] font-bold px-2 py-0.5 rounded-full">{{
      commentsList.length
    }}</span>
  </div>

  <!-- comment details  -->
  @for (com of commentsList; track com._id) {
    <div class="flex gap-2 mb-4 group">
      <img
        [src]="com.commentCreator.photo"
        [alt]="com.commentCreator.name"
        class="w-8 h-8 rounded-full object-cover shrink-0 mt-1 bg-slate-100 border border-slate-50"
      />

      <div class="flex-1 flex flex-col items-start min-w-0">
        <div class="bg-slate-100 rounded-2xl rounded-tl-none px-3.5 py-2.5 max-w-[85%] sm:max-w-[75%]">
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="text-[13px] font-bold text-slate-900 hover:underline cursor-pointer truncate max-w-full">{{
              com.commentCreator.name
            }}</span>
          </div>

          <div class="flex flex-wrap items-center gap-x-1 text-[12px] text-slate-500 mb-1">
            <span>@{{ com.commentCreator.username }}</span>
            <span>&middot;</span>
            <span>{{ com.createdAt }}</span>
          </div>

          @if (com.content) {
            <p class="text-[14px] text-slate-800 wrap-break-word line-clamp-8">
              {{ com.content }}
            </p>
          }

          @if (com.image) {
            <img [src]="com.image" class="mt-2 w-full max-w-[220px] sm:max-w-[280px] h-auto max-h-[200px] sm:max-h-[240px] rounded-xl object-cover" alt="" />
          }
        </div>

        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 ml-2 text-[12px] text-slate-500 font-semibold">
          <span class="cursor-pointer hover:underline">{{ com.createdAt }}</span>
          <button class="cursor-pointer hover:underline">Like {{ com.likes.length }}</button>
          <button class="cursor-pointer hover:underline">Reply</button>
          <button
            class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity"
          >
            <i class="fa-solid fa-ellipsis"></i>
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Create Comments  -->

  <form #resetDataForm
    (submit)="submitComment($event, resetDataForm)"
    class="min-w-0 flex-1 bg-slate-100 border border-transparent shadow-sm focus-within:border-blue-300 focus-within:ring-4 focus-within:ring-blue-50 focus-within:bg-white transition-all rounded-[20px] p-2 flex flex-col"
  >
    <div class="flex flex-col gap-2">
      <img
        src="https://i.pravatar.cc/150?img=11"
        alt="Ahmed Menisy"
        class="w-8 h-8 rounded-full object-cover shrink-0 mt-1 bg-slate-100 border border-slate-50"
      />

      <textarea
        [formControl]="createPost"
        class="w-full bg-transparent focus:border-none border-none focus:ring-0 focus:outline-none text-base text-slate-800 placeholder-slate-500 resize-none outline-none px-2 pt-1 pb-3 min-h-[60px]"
        placeholder="Comment as ..."
      ></textarea>

      @if (imgUrl) {
        <img
          [src]="imgUrl"
          class="mx-auto h-auto max-h-[480px] w-full max-w-full rounded-2xl object-contain"
          alt=""
        />
        <button
          type="button"
          (click)="removeImg(fileInput)"
          aria-label="Remove image"
          class="absolute top-2 end-2 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full bg-black/60 text-white backdrop-blur transition-colors hover:bg-red-600"
        >
          <i class="fa-solid fa-trash-can text-sm"></i>
        </button>
      }

      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1">
          <input type="file" id="file" class="hidden" #fileInput (change)="changeImg($event)" />
          <label
            for="file"
            class="flex cursor-pointer items-center gap-2 text-slate-600 hover:bg-slate-50 px-2 py-1.5 rounded-lg transition-colors group"
          >
            <i
              class="fa-regular fa-image text-[#22c55e] text-[1.1rem] group-hover:scale-110 transition-transform"
            ></i>
            <span class="text-[14px] font-semibold text-slate-600">Photo/video</span>
          </label>
        </div>

        <button
          type="submit"
          class="w-8 cursor-pointer h-8 rounded-full bg-gradient-to-br from-[#00298d] via-[#2456d6] to-[#5b8cff] hover:brightness-110 text-white flex items-center justify-center transition"
        >
          <i class="fa-solid fa-paper-plane text-[13px]"></i>
        </button>
      </div>
    </div>
  </form>
</section>
