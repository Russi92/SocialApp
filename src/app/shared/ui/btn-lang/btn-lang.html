<div
  class="flex items-center gap-1 rounded-full border border-white/25 bg-white/10 p-1 backdrop-blur"
  role="group"
  aria-label="Language"
>
  @if (lang === 'en') {
    <button
      (click)="change('ar')"
      class="cursor-pointer rounded-full px-3 py-1 text-xs font-bold text-white transition-colors hover:bg-white/25 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
    >
      AR
    </button>
  }
  @if (lang === 'ar') {
    <button
      (click)="change('en')"
      class="cursor-pointer rounded-full px-3 py-1 text-xs font-bold text-white transition-colors hover:bg-white/25 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
    >
      EN
    </button>
  }
</div>
